name: mimir-mk2
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mimir
      POSTGRES_DB: mimir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random PostgreSQL password in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mimir -d mimir"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://mimir:${POSTGRES_PASSWORD}@db:5432/mimir
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      BLABLA_COOKIE: ${BLABLA_COOKIE:-}
      DILDORO_API_KEY: ${DILDORO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${WEB_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  db-data:
  caddy-data:
  caddy-config:
