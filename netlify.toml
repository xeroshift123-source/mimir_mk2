[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/assets/*.js"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*.css"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/index.html"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/data/*"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/"
  [headers.values]
  Cache-Control = "no-cache"

[[headers]]
for = "/flutter_service_worker.js"
  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"
